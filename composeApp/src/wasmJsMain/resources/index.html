<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#FAF8F5">
    
    <title>AI Writing Detector</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #FAF8F5;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #FAF8F5;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-title {
            font-size: 2rem;
            font-weight: 700;
            color: #1A1816;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }
        
        .loading-subtitle {
            font-size: 2rem;
            font-weight: 700;
            color: #2A9D8F;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #E8E4DE;
            border-top-color: #2A9D8F;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #5A5651;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (prefers-color-scheme: dark) {
            html, body, #loading {
                background-color: #1A1816;
            }
            
            .loading-title {
                color: #E8E4DE;
            }
            
            .loading-spinner {
                border-color: #302D2A;
                border-top-color: #52B5A9;
            }
            
            .loading-text {
                color: #B5AEA4;
            }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-title">AI Writing</div>
        <div class="loading-subtitle">Detector</div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading application...</div>
    </div>
    
    <script src="composeApp.js"></script>
    <script>
        // Hide loading screen once WASM is ready
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        });
    </script>
</body>
</html>
